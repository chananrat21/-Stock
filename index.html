<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger • Stock Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf5ec; --bg2:#f4faf5; --card:#ffffff; --line:#d7e8da;
  --ink:#16241b; --sub:#5c7566; --green:#1f6b3f; --green-dk:#123f26; --green-lt:#e3f3e6;
  --amber:#8a6d1f; --amber-bg:#fdf3d9; --red:#b23a3a; --red-bg:#fbe4e4;
  --radius:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand-eyebrow{font-size:11px;letter-spacing:.08em;color:var(--red);font-weight:700;margin-bottom:4px}
.brand h1{font-size:28px;margin:0 0 6px;font-weight:800;color:var(--green-dk)}
.brand p{margin:0;color:var(--sub);font-size:13.5px;max-width:520px}
.user{display:flex;align-items:center;gap:10px}
.user img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#cfe3d3}
.user .name{font-weight:700;font-size:13.5px}
.user .tel{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 18px;align-items:center}
.tab-btn{background:var(--card);border:1px solid var(--line);color:var(--green-dk);padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.tab-btn.active{background:var(--green-dk);color:#fff;border-color:var(--green-dk)}
.searchbar{margin-left:auto;display:flex;gap:8px;align-items:center}
.searchbar input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:13px;width:220px;font-family:inherit}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--green-dk)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .15s}
.stat:hover{border-color:var(--green)}
.stat.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.stat .lbl{font-size:12.5px;color:var(--sub);margin-bottom:8px}
.stat .num{font-size:26px;font-weight:800;color:var(--green-dk)}
.stat .sub{font-size:11.5px;color:var(--sub);margin-top:4px}
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.section-title{font-size:16px;font-weight:800;margin:0 0 3px;color:var(--green-dk)}
.section-sub{font-size:12.5px;color:var(--sub);margin:0 0 14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--sub);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.pill{padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--green-lt);color:var(--green-dk)}
.pill.low{background:var(--amber-bg);color:var(--amber)}
.pill.out{background:var(--red-bg);color:var(--red)}
.recent{display:flex;flex-direction:column;gap:14px;max-height:430px;overflow-y:auto}
.recent-item{display:flex;gap:10px;font-size:13px}
.dot{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.dot.in{background:var(--green-lt);color:var(--green-dk)}
.dot.out{background:var(--red-bg);color:var(--red)}
.recent-item .name{font-weight:700}
.recent-item .meta{color:var(--sub);font-size:11.5px;margin-top:2px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--green-dk);margin-bottom:6px}
select,input[type=text],input[type=number],textarea,input[type=date]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;background:var(--bg2)}
textarea{resize:vertical;min-height:70px}
.stock-box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:var(--sub)}
.stock-box b{font-size:20px;color:var(--green-dk)}
.imgbox{border:1.5px dashed var(--line);border-radius:10px;height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg2);cursor:pointer;position:relative}
.imgbox img{width:100%;height:100%;object-fit:contain}
.imgbox .ph{font-size:12px;color:var(--sub);text-align:center;padding:8px}
.btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--green-dk);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--green-dk)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.actions-row{display:flex;gap:10px}
.tip-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;font-size:12.5px;color:var(--sub);line-height:1.7}
.tip-card h4{margin:0 0 8px;font-size:13.5px;color:var(--green-dk)}
.tip-card .note{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.manage-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.side-edit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.side-edit h3{margin:0 0 3px;font-size:15px;color:var(--green-dk)}
.side-edit p{margin:0 0 14px;font-size:12px;color:var(--sub)}
.old-val{color:var(--red);font-weight:800;font-size:15px}
.row-editing td{background:var(--green-dk)!important;color:#fff}
.row-editing .pill{color:var(--ink)}
footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--sub)}
footer .flinks{display:flex;gap:20px}
.empty{padding:40px 10px;text-align:center;color:var(--sub);font-size:13px}
.done-overlay{position:fixed;inset:0;background:rgba(18,63,38,.55);display:flex;align-items:center;justify-content:center;z-index:9999;animation:doneFadeIn .2s ease}
.done-overlay.fade-out{opacity:0;transition:opacity .3s ease}
.done-card{background:var(--card);border-radius:16px;padding:34px 44px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:280px}
.done-check{width:56px;height:56px;border-radius:50%;background:var(--green-lt);color:var(--green-dk);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done-msg{font-weight:700;color:var(--green-dk);font-size:14.5px}
@keyframes doneFadeIn{from{opacity:0}to{opacity:1}}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
select.prodpick{background:var(--bg2)}
@media (max-width:880px){
  .two-col,.manage-grid,.form-grid{grid-template-columns:1fr}
  .grid4,.kpi-row{grid-template-columns:1fr 1fr}
  .searchbar{margin-left:0;width:100%}
  .searchbar input{flex:1}
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1712;--bg2:#132019;--card:#152219;--line:#24382b;--ink:#e7f2ea;--sub:#8fa896;
    --green-lt:#173926;--amber-bg:#2e2610;--red-bg:#301616;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1712;--bg2:#132019;--card:#152219;--line:#24382b;--ink:#e7f2ea;--sub:#8fa896;
  --green-lt:#173926;--amber-bg:#2e2610;--red-bg:#301616;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="brand-eyebrow">LEDGER • STOCK CONTROL</div>
      <h1>คลังสินค้า</h1>
      <p>ระบบสมุดบัญชี สำหรับรับเข้า เบิกจ่าย ตรวจสอบคงเหลือ และติดตามความเคลื่อนไหวของวัสดุอุปกรณ์ภายในสำนักงาน</p>
    </div>
    <div class="user">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='20' fill='%23123f26'/%3E%3Ctext x='20' y='26' font-family='Inter,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3ETK%3C/text%3E%3C/svg%3E" alt="">
      <div><div class="name">Mr. Thavrith Khmer</div><div class="tel">(+855) 69 927 112</div></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn" data-tab="overview">ภาพรวมคลัง</button>
    <button class="tab-btn" data-tab="move">เบิก / รับสินค้า</button>
    <button class="tab-btn" data-tab="manage">จัดการสต๊อก</button>
    <button class="tab-btn" data-tab="history">ประวัติรายการ</button>
    <button class="tab-btn" data-tab="dash">Dashboard</button>
    <div class="searchbar">
      <input id="searchInput" placeholder="ค้นหาชื่อสินค้า...">
      <div class="iconbtn" onclick="resetDemo()" title="รีเซ็ตข้อมูลตัวอย่าง">⟳</div>
    </div>
  </div>

  <div id="view"></div>

  <footer>
    <div class="flinks">
      <span>🏠 หน้าหลัก</span><span>📋 สต๊อกพัสดุ</span><span>⇅ รายการเบิกจ่าย</span><span>⚙ ตั้งค่า</span>
    </div>
    <div>© 2026 Ledger Inc. ระบบบวงคุมคลังสินค้าสำนักงาน</div>
  </footer>
</div>

<script>
/* ---------- Data layer ---------- */
window.STOCK_API_URL = window.STOCK_API_URL || 'https://script.google.com/macros/s/AKfycbyDoHMHze1w-118KKqHZ21KlEdC8Is8nhR8s5VWRTavt38UwYS-WjuqFcLwtzY22M9vjQ/exec';
const LS_KEY='ledger_stock_v1';
const GOOGLE_API_URL = (window.STOCK_API_URL || '').trim();
const USE_GOOGLE_SHEET = !!GOOGLE_API_URL && !GOOGLE_API_URL.startsWith('PASTE_') && !GOOGLE_API_URL.includes('YOUR_GOOGLE_WEB_APP_URL');

function normalizeGoogleProduct(row){
  const qty = Number(row.qty ?? row.current ?? 0);
  const initial = Number(row.initial ?? qty);
  const price = Number(row.price_per_unit ?? row.price ?? 0);
  const img = row.image_url || row.img || mockImg((row.name || 'SKU').slice(0, 3).toUpperCase(), '#1f6b3f');
  return {
    id: String(row.product_id || row.id || 'p_' + Date.now() + Math.random()),
    name: row.name || 'Unnamed product',
    unit: row.unit || 'ชิ้น',
    initial,
    current: qty,
    price,
    img,
    mfg: row.mfg_date || '',
    expiry: row.expiry_date || '',
    supplier: row.supplier || '',
    status: row.status || 'OK',
    category: row.category || ''
  };
}

function normalizeGoogleMovement(row){
  return {
    id: String(row.movement_id || row.id || 'm_' + Date.now() + Math.random()),
    pid: String(row.product_id || row.pid || ''),
    type: String(row.movement_type || row.type || 'out').toLowerCase() === 'in' ? 'in' : 'out',
    qty: Number(row.qty || 0),
    note: row.note || row.reason || 'Moved from Google Sheet',
    ts: row.created_at ? new Date(row.created_at).getTime() : Date.now()
  };
}

function showDoneOverlay(msg){
  const ov=document.createElement('div');
  ov.className='done-overlay';
  ov.innerHTML=`<div class="done-card"><div class="done-check">✓</div><div class="done-msg">${msg||'ทำรายการเสร็จสิ้น'}</div></div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{
    ov.classList.add('fade-out');
    setTimeout(()=>ov.remove(),300);
  },3000);
}
function mockImg(label,bg){
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='${bg}'/><circle cx='100' cy='82' r='40' fill='#ffffff' opacity='.18'/><text x='100' y='95' font-family='Inter,sans-serif' font-size='34' font-weight='800' fill='#ffffff' text-anchor='middle'>${label}</text><text x='100' y='128' font-family='Inter,sans-serif' font-size='13' fill='#ffffff' opacity='.85' text-anchor='middle'>ตัวอย่างสินค้า</text></svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
function seedData(){
  const now=Date.now();
  const products=[
    {id:'p1',name:'เคมีภัณฑ์ปรับปรุงคุณภาพดิน (pH12)',unit:'กระสอบ',initial:30,current:24,price:450,img:mockImg('pH12','#1f6b3f'),mfg:'2026-05-10',expiry:'2026-11-15'},
    {id:'p2',name:'ปุ๋ยกระถิน 16-16-16',unit:'กระสอบ',initial:80,current:58,price:620,img:mockImg('16-16-16','#2f7d46'),mfg:'2026-06-01',expiry:'2027-06-01'},
    {id:'p3',name:'มูลชี้วัว SPRING',unit:'กระสอบ',initial:20,current:0,price:280,img:mockImg('SPRING','#8a5a2f'),mfg:'2026-04-05',expiry:'2026-10-05'},
    {id:'p4',name:'โครออแกนิก สูตรบำรุงผล เพิ่มหวาน',unit:'ถัง',initial:100,current:76,price:190,img:mockImg('ออร์แกนิก','#3f8a5b'),mfg:'2026-07-20',expiry:'2027-01-20'},
    {id:'p5',name:'ปุ๋ยอินทรีย์ ออสโมโค้ท 13-13-13',unit:'กล่อง',initial:35,current:18,price:340,img:mockImg('13-13-13','#4a9563'),mfg:'2026-04-30',expiry:'2026-10-30'},
    {id:'p6',name:'สารชีวอินทรีย์ ฮูมิคส์ สูตรเร่งดอก เพิ่มการติดผล',unit:'ขวด',initial:40,current:12,price:150,img:mockImg('ฮูมิคส์','#6b8a2f'),mfg:'2026-03-20',expiry:'2026-09-20'},
    {id:'p7',name:'ปุ๋ยอินทรีย์เม็ดน้ำค้างดาว TPI',unit:'กระสอบ',initial:25,current:5,price:510,img:mockImg('TPI','#2f6b52'),mfg:'2026-09-01',expiry:'2027-03-01'},
  ];
  const tx=[
    {id:'t1',pid:'p1',type:'out',qty:6,note:'ฝ่ายจุรงศ์',ts:now-3*864e5},
    {id:'t2',pid:'p2',type:'out',qty:22,note:'ฝ่ายบรรจุ',ts:now-5*864e5},
    {id:'t3',pid:'p3',type:'out',qty:20,note:'แผนกโภช',ts:now-7*864e5},
    {id:'t4',pid:'p4',type:'out',qty:24,note:'จัดส่งกลาง',ts:now-9*864e5},
    {id:'t5',pid:'p5',type:'out',qty:17,note:'ฝ่ายสวนบุ',ts:now-11*864e5},
    {id:'t6',pid:'p6',type:'in',qty:12,note:'ยอดรับเข้าคลัง',ts:now-13*864e5},
  ];
  return {products,tx};
}
async function fetchGoogleData() {
  if (!USE_GOOGLE_SHEET) return null;
  try {
    const productsRes = await fetch(`${GOOGLE_API_URL}?type=products`);
    const movementsRes = await fetch(`${GOOGLE_API_URL}?type=stock_movements`);
    if (!productsRes.ok || !movementsRes.ok) return null;

    const productsJson = await productsRes.json();
    const movementsJson = await movementsRes.json();

    if (!Array.isArray(productsJson) || !Array.isArray(movementsJson)) return null;

    return {
      products: productsJson.map(normalizeGoogleProduct),
      tx: movementsJson.map(normalizeGoogleMovement)
    };
  } catch (error) {
    console.warn('Google Sheet fetch failed, falling back to local data:', error);
    return null;
  }
}

function loadData(){
  try{const raw=localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw);}catch(e){}
  const d=seedData(); saveData(d); return d;
}
function saveData(d){ try{localStorage.setItem(LS_KEY,JSON.stringify(d));}catch(e){} }
let DB=loadData();

async function hydrateFromGoogleIfAvailable(){
  const remote = await fetchGoogleData();
  if (remote) {
    DB = remote;
    saveData(DB);
    render();
  }
}

function resetDemo(){ DB=seedData(); saveData(DB); render(); }

function fmt(n){ return new Intl.NumberFormat('th-TH').format(n); }
function fmtBaht(n){ return n||n===0? fmt(n)+' บาท' : '-'; }
function dateStr(ts){ const d=new Date(ts); return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function statusOf(p){ if(p.current<=0) return {c:'out',t:'สินค้าหมด'}; if(p.current<=5) return {c:'low',t:'ใกล้หมด'}; return {c:'ok',t:'พร้อมใช้'}; }
function monthsUntil(dateStr){
  if(!dateStr) return null;
  const now=new Date(), exp=new Date(dateStr);
  let m=(exp.getFullYear()-now.getFullYear())*12+(exp.getMonth()-now.getMonth());
  if(exp.getDate()<now.getDate()) m-=1;
  return m;
}
function expiryTag(p){
  const m=monthsUntil(p.expiry);
  if(m===null) return '';
  if(m<0) return `<div style="color:var(--red);font-size:11.5px;margin-top:3px;font-weight:700">⚠ หมดอายุแล้ว ${Math.abs(m)} เดือนก่อน</div>`;
  if(m<=3) return `<div style="color:var(--red);font-size:11.5px;margin-top:3px;font-weight:700">⚠ ใกล้หมดอายุอีก ${m} เดือน</div>`;
  return '';
}

let activeTab='overview';
let overviewFilter='all';
function setOverviewFilter(f){ overviewFilter=f; render(); }
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab; render();}));
document.getElementById('searchInput').addEventListener('input',render);

/* ---------- Renderers ---------- */
function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
  const view=document.getElementById('view');
  if(activeTab==='overview') view.innerHTML=renderOverview();
  else if(activeTab==='move') { view.innerHTML=renderMove(); bindMove(); }
  else if(activeTab==='manage'){ view.innerHTML=renderManage(); bindManage(); }
  else if(activeTab==='history') view.innerHTML=renderHistory();
  else if(activeTab==='dash'){ view.innerHTML=renderDash(); bindDash(); }
}

function renderOverview(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  let list=DB.products.filter(p=>p.name.toLowerCase().includes(q));
  const total=DB.products.length;
  const totalQty=DB.products.reduce((s,p)=>s+p.current,0);
  const low=DB.products.filter(p=>p.current>0&&p.current<=5).length;
  const out=DB.products.filter(p=>p.current<=0).length;
  if(overviewFilter==='low') list=list.filter(p=>p.current>0&&p.current<=5);
  else if(overviewFilter==='out') list=list.filter(p=>p.current<=0);
  else if(overviewFilter==='total') list=list.filter(p=>p.current>5);
  const recent=[...DB.tx].sort((a,b)=>b.ts-a.ts).slice(0,7);
  const titles={all:'รายการคงเหลือ',total:'รายการคงเหลือ (พร้อมใช้)',low:'รายการใกล้หมด',out:'รายการสินค้าหมด'};
  return `
  <div class="grid4">
    <div class="stat ${overviewFilter==='total'?'on':''}" onclick="setOverviewFilter('total')"><div class="lbl">รายการทั้งหมด</div><div class="num">${total} รายการ</div><div class="sub">หมวดหมู่พัสดุคงเหลือ</div></div>
    <div class="stat ${overviewFilter==='all'?'on':''}" onclick="setOverviewFilter('all')"><div class="lbl">จำนวนคงเหลือรวม</div><div class="num">${fmt(totalQty)}</div><div class="sub">ทุกหน่วยนับรวมกัน</div></div>

function bindMove(){
  const typeSel=document.getElementById('mvType'), prodSel=document.getElementById('mvProd');
  const prodNew=document.getElementById('mvProdNew'), prodLabel=document.getElementById('mvProdLabel');
  const stockEl=document.getElementById('mvStock'), imgBox=document.getElementById('mvImgBox');
  const newFields=document.getElementById('mvNewFields'), imgLabel=document.getElementById('mvImgLabel');
  const infoRow=document.getElementById('mvInfoRow'), infoText=document.getElementById('mvInfoText');
  function refresh(){
    const isIn=typeSel.value==='in';
    mvCurrentIsIn=isIn;
    newFields.style.display=isIn?'block':'none';
    document.getElementById('mvDateStart').disabled=!isIn;
    document.getElementById('mvDateEnd').disabled=!isIn;
    document.getElementById('mvQty').placeholder=isIn?'ระบุจำนวนสินค้าใหม่ที่นำเข้า...':'ระบุจำนวนที่ต้องการเบิก...';
    const priceEl=document.getElementById('mvPrice');
    if(isIn){
      prodLabel.textContent='สินค้า (พิมพ์ชื่อสินค้าใหม่)';
      prodSel.style.display='none'; prodNew.style.display='block';
      imgLabel.textContent='รูปสินค้า (สินค้าใหม่)';
      imgBox.innerHTML='<div class="ph">คลิกเพื่ออัปโหลดรูปสินค้าใหม่</div>';
      imgBox.style.cursor='pointer';
      stockEl.textContent='0';
      infoRow.style.display='none';
      document.getElementById('mvDateStart').value=''; document.getElementById('mvDateEnd').value='';
      priceEl.disabled=false; priceEl.value='0'; priceEl.style.background='var(--card)'; priceEl.style.color='var(--ink)';
    } else {
      prodLabel.textContent='สินค้า';
      prodSel.style.display='block'; prodNew.style.display='none';
      const p=DB.products.find(x=>x.id===prodSel.value);
      stockEl.textContent=fmt(p?p.current:0);
      imgLabel.textContent='รูปสินค้า (ข้อมูลเดิม)';
      imgBox.style.cursor='default';
      imgBox.innerHTML = p&&p.img? `<img src="${p.img}">` : `<div class="ph">ไม่มีรูปสินค้าที่บันทึกไว้</div>`;
      infoRow.style.display='flex';
      document.getElementById('mvDateStart').value=p&&p.mfg?p.mfg:'';
      document.getElementById('mvDateEnd').value=p&&p.expiry?p.expiry:'';
      priceEl.disabled=true; priceEl.value=p?(p.price||0):0; priceEl.style.background='var(--bg2)'; priceEl.style.color='var(--sub)';
      const expTag=p?expiryTag(p).replace(/<div[^>]*>/,'').replace('</div>',''):'';
      infoText.innerHTML = p? `หน่วยนับ: <b>${p.unit}</b>${p.mfg?` · วันที่ผลิต: <b>${p.mfg}</b>`:''}${p.expiry?` · วันหมดอายุ: <b>${p.expiry}</b>`:''}${expTag?` <span style="color:var(--red);font-weight:700">${expTag}</span>`:''}` : '';
    }
  }
  typeSel.addEventListener('change',refresh);
  prodSel.addEventListener('change',refresh);
  document.getElementById('mvFile').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ imgBox.innerHTML=`<img src="${r.result}">`; imgBox.dataset.data=r.result; };
    r.readAsDataURL(f);
  });
  refresh();
}
async function saveMove(){
  const type=document.getElementById('mvType').value;
  const qty=parseInt(document.getElementById('mvQty').value||'0',10);
  const note=document.getElementById('mvNote').value.trim();
  if(!qty||qty<=0){ alert('กรุณาระบุจำนวนพัสดุให้ถูกต้อง'); return; }

  if (USE_GOOGLE_SHEET) {
    if (type === 'in') {
      const name=document.getElementById('mvProdNew').value.trim();
      const unit=document.getElementById('mvNewUnit').value.trim();
      if(!name||!unit){ alert('กรุณาระบุชื่อสินค้าและหน่วยนับ'); return; }
      const payload = {
        type: 'addProduct',
        name,
        unit,
        qty,
        min_stock: 0,
        price_per_unit: Number(document.getElementById('mvPrice').value || 0),
        category: 'General',
        supplier: 'Google Sheet',
        image_url: document.getElementById('mvImgBox').dataset.data || '',
        mfg_date: document.getElementById('mvDateStart').value || '',
        expiry_date: document.getElementById('mvDateEnd').value || ''
      };
      const res = await fetch(`${GOOGLE_API_URL}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      if (!result || !result.success) {
        alert('เพิ่มข้อมูลไปยัง Google Sheet ไม่สำเร็จ');
        return;
      }
      await hydrateFromGoogleIfAvailable();
      showDoneOverlay('บันทึกรายการเรียบร้อยแล้ว');
      return;
    }

    const pid=document.getElementById('mvProd').value;
    const p=DB.products.find(x=>x.id===pid);
    if(!p){ alert('ไม่พบสินค้า'); return; }
    if(qty>p.current){ alert('จำนวนที่เบิกมากกว่ายอดคงเหลือในระบบ'); return; }
    const res = await fetch(`${GOOGLE_API_URL}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'addMovement',
        product_id: pid,
        movement_type: 'OUT',
        qty,
        reason: 'เบิกสินค้า',
        note: note || 'เบิกจ่ายสินค้า',
        created_by: 'web_user'
      })
    });
    const result = await res.json();
    if (!result || !result.success) {
      alert('บันทึกรายการเบิกสินค้าไม่สำเร็จ');
      return;
    }
    await hydrateFromGoogleIfAvailable();
    showDoneOverlay('บันทึกรายการเรียบร้อยแล้ว');
    return;
  }

  if(type==='in'){
    const name=document.getElementById('mvProdNew').value.trim();
    const unit=document.getElementById('mvNewUnit').value.trim();
    if(!name||!unit){ alert('กรุณาระบุชื่อสินค้าและหน่วยนับ'); return; }
    const img=document.getElementById('mvImgBox').dataset.data||'';
    const mfg=document.getElementById('mvDateStart').value||'';
    const expiry=document.getElementById('mvDateEnd').value||'';
    const price=parseFloat(document.getElementById('mvPrice').value||'0');
    const id='p'+Date.now();
    DB.products.push({id,name,unit,initial:qty,current:qty,img,mfg,expiry,price});
    DB.tx.push({id:'t'+Date.now(),pid:id,type:'in',qty,note:note||'รับสินค้าใหม่เข้าคลัง',ts:Date.now()});
  } else {
    const pid=document.getElementById('mvProd').value;
    const p=DB.products.find(x=>x.id===pid);
    if(!p){ alert('ไม่พบสินค้า'); return; }
    if(qty>p.current){ alert('จำนวนที่เบิกมากกว่ายอดคงเหลือในระบบ'); return; }
    p.current-=qty;
    DB.tx.push({id:'t'+Date.now(),pid,type:'out',qty,note:note||'เบิกจ่ายสินค้า',ts:Date.now()});
  }
  saveData(DB); render();
  showDoneOverlay('บันทึกรายการเรียบร้อยแล้ว');
}

  const name=document.getElementById('edName').value.trim();
  const unit=document.getElementById('edUnit').value.trim();
  if(!name||!unit){ alert('กรุณาระบุชื่อสินค้าและหน่วยนับ'); return; }

  if (USE_GOOGLE_SHEET) {
    const payload = {
      type: 'updateProduct',
      product_id: id,
      name,
      unit,
      qty: Number(p.current || 0),
      min_stock: 0,
      price_per_unit: Number(document.getElementById('edPrice').value || 0),
      category: 'General',
      supplier: 'Google Sheet',
      image_url: document.getElementById('edImgBox').dataset.data || p.img || '',
      mfg_date: document.getElementById('edMfg').value || '',
      expiry_date: document.getElementById('edExpiry').value || ''
    };
    const res = await fetch(`${GOOGLE_API_URL}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (!result || !result.success) {
      alert('แก้ไขสินค้าใน Google Sheet ไม่สำเร็จ');
      return;
    }
    await hydrateFromGoogleIfAvailable();
    showDoneOverlay('บันทึกการแก้ไขเรียบร้อยแล้ว');
    return;
  }

  const mfg=document.getElementById('edMfg').value||'';
  const expiry=document.getElementById('edExpiry').value||'';
  const price=parseFloat(document.getElementById('edPrice').value||'0');
  const newImg=document.getElementById('edImgBox').dataset.data;
  p.name=name; p.unit=unit; p.mfg=mfg; p.expiry=expiry; p.price=price;
  if(newImg) p.img=newImg;
  saveData(DB); render();
}
function openAdjust(id){
  const p=DB.products.find(x=>x.id===id); if(!p) return;
  highlightRow(id);
  const panel=document.getElementById('sidePanel');
  panel.innerHTML=`
    <h3>ปรับยอดสต๊อก</h3>
    <p>${p.name}</p>
    <div class="stock-box"><span>ยอดสินค้าเดิม</span><span class="old-val">${fmt(p.current)} ${p.unit}</span></div>
    <label>เพิ่มยอดใหม่ (บวกเข้ากับยอดเดิม ใส่ค่าติดลบเพื่อลด)</label>
    <input type="number" id="adjQty" value="0" style="margin-bottom:16px">
    <button class="btn primary" style="width:100%" onclick="applyAdjust('${id}')">บันทึกยอดใหม่</button>
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="render()">ยกเลิก</button>
  `;
}
function applyAdjust(id){
  const p=DB.products.find(x=>x.id===id); if(!p) return;
  const delta=parseInt(document.getElementById('adjQty').value||'0',10);
  const nv=p.current+delta;
  if(nv<0){ alert('ยอดสินค้ารวมต้องไม่ติดลบ'); return; }
  p.current=nv;
  DB.tx.push({id:'t'+Date.now(),pid:id,type:delta>=0?'in':'out',qty:Math.abs(delta),note:'ปรับยอดจากการตรวจนับสต๊อก',ts:Date.now()});
  saveData(DB); render();
}

function renderHistory(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const rows=[...DB.tx].sort((a,b)=>b.ts-a.ts).filter(t=>{const p=DB.products.find(x=>x.id===t.pid); return p&&p.name.toLowerCase().includes(q);});
  return `
  <div class="card">
    <div class="section-title">ประวัติรายการ</div>
    <div class="section-sub">แสดงความเคลื่อนไหวทั้งหมดของสินค้า ทั้งรายการรับเข้าและเบิกจ่าย</div>
    <table><thead><tr><th>วันที่</th><th>ชื่อสินค้า</th><th>ประเภท</th><th>จำนวน</th><th>หมายเหตุ</th></tr></thead><tbody>
    ${rows.map(t=>{const p=DB.products.find(x=>x.id===t.pid); if(!p)return'';return `
      <tr><td>${dateStr(t.ts)}</td><td>${p.name}</td><td><span class="pill ${t.type==='in'?'ok':'out'}">${t.type==='in'?'รับเข้า':'เบิกจ่าย'}</span></td><td>${t.type==='in'?'+':'-'}${fmt(t.qty)} ${p.unit}</td><td>${t.note||'-'}</td></tr>`}).join('')||`<tr><td colspan=5 class="empty">ไม่พบประวัติรายการ</td></tr>`}
    </tbody></table>
  </div>`;
}

let dashMode='month', dashFilter='out';
const CHART_COLORS=['#1f6b3f','#2f7d46','#4a9563','#6b8a2f','#8a5a2f','#3f8a5b','#2f6b52','#9a7d1f','#5c7566','#b23a3a'];
function pieChartSVG(){
  const data=DB.products.map(p=>({name:p.name,val:p.current,unit:p.unit}));
  const total=data.reduce((s,d)=>s+d.val,0);
  if(total<=0) return `<div class="empty">ยังไม่มีสินค้าคงเหลือให้แสดงผล</div>`;
  const cx=110,cy=110,r=95;
  let cum=-Math.PI/2, slices='';
  data.forEach((d,i)=>{
    if(d.val<=0) return;
    const angle=(d.val/total)*Math.PI*2, end=cum+angle;
    const x1=cx+r*Math.cos(cum), y1=cy+r*Math.sin(cum);
    const x2=cx+r*Math.cos(end), y2=cy+r*Math.sin(end);
    const large=angle>Math.PI?1:0;
    slices+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${CHART_COLORS[i%CHART_COLORS.length]}" stroke="var(--card)" stroke-width="2"></path>`;
    cum=end;
  });
  const legend=data.map((d,i)=>{
    if(d.val<=0) return '';
    const pct=Math.round((d.val/total)*100);
    return `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px">
      <span style="width:10px;height:10px;border-radius:3px;background:${CHART_COLORS[i%CHART_COLORS.length]};flex-shrink:0"></span>
      <span style="flex:1">${d.name}</span><b>${fmt(d.val)} ${d.unit}</b>
      <span style="color:var(--sub);width:38px;text-align:right">${pct}%</span></div>`;
  }).join('');
  return `<div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 220 220" width="220" height="220">${slices}
      <circle cx="110" cy="110" r="55" fill="var(--card)"></circle>
      <text x="110" y="104" text-anchor="middle" font-size="12" fill="var(--sub)">คงเหลือรวม</text>
      <text x="110" y="124" text-anchor="middle" font-size="18" font-weight="800" fill="var(--green-dk)">${fmt(total)}</text>
    </svg>
    <div style="flex:1;min-width:220px">${legend}</div>
  </div>`;
}
function barCompareSVG(){
  const data=DB.products.map(p=>{
    const sold=DB.tx.filter(t=>t.pid===p.id&&t.type==='out').reduce((s,t)=>s+t.qty,0);
    return {name:p.name,total:p.initial,sold};
  });
  if(!data.length) return `<div class="empty">ยังไม่มีข้อมูลสินค้า</div>`;
  const maxV=Math.max(1,...data.map(d=>Math.max(d.total,d.sold)));
  const barW=26,gap=20,groupW=barW*2+6,leftPad=10,chartH=180,topPad=26,botPad=40;
  const width=leftPad+data.length*(groupW+gap);
  let bars='';
  data.forEach((d,i)=>{
    const gx=leftPad+i*(groupW+gap);
    const h1=Math.round((d.total/maxV)*chartH), h2=Math.round((d.sold/maxV)*chartH);
    const y1=topPad+chartH-h1, y2=topPad+chartH-h2;
    const label=d.name.length>11?d.name.slice(0,10)+'…':d.name;
    bars+=`<rect x="${gx}" y="${y1}" width="${barW}" height="${h1}" fill="var(--green)" rx="4"></rect>`;
    bars+=`<rect x="${gx+barW+6}" y="${y2}" width="${barW}" height="${h2}" fill="var(--red)" rx="4"></rect>`;
    bars+=`<text x="${gx+barW/2}" y="${y1-5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--green-dk)">${fmt(d.total)}</text>`;
    bars+=`<text x="${gx+barW+6+barW/2}" y="${y2-5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--red)">${fmt(d.sold)}</text>`;
    bars+=`<text x="${gx+barW}" y="${topPad+chartH+16}" text-anchor="middle" font-size="10" fill="var(--sub)">${label}</text>`;
  });
  return `<div style="overflow-x:auto">
    <svg viewBox="0 0 ${width} ${topPad+chartH+botPad}" width="${width}" height="${topPad+chartH+botPad}" style="min-width:${Math.max(width,320)}px">
      <line x1="0" y1="${topPad+chartH}" x2="${width}" y2="${topPad+chartH}" stroke="var(--line)"></line>
      ${bars}
    </svg></div>
  <div style="display:flex;gap:18px;margin-top:6px;font-size:12px;color:var(--sub);flex-wrap:wrap">
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--green);border-radius:3px;margin-right:5px"></span>จำนวนทั้งหมด (ยอดตั้งต้น)</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--red);border-radius:3px;margin-right:5px"></span>จำนวนที่ขายออก (เบิกจ่ายสะสม)</span>
  </div>`;
}
function setDashFilter(f){ dashFilter=f; renderDash2(); }
function renderDash(){
  return `<div id="dashBody"></div>`;
}
function bindDash(){
  renderDash2();
}
function renderDash2(){
  const body=document.getElementById('dashBody');
  const totalIn=DB.tx.filter(t=>t.type==='in').reduce((s,t)=>s+t.qty,0);
  const totalOut=DB.tx.filter(t=>t.type==='out').reduce((s,t)=>s+t.qty,0);
  const totalInit=DB.products.reduce((s,p)=>s+p.initial,0)||1;
  const totalCur=DB.products.reduce((s,p)=>s+p.current,0);
  const soldPct=Math.min(100,Math.round((totalOut/(totalInit))*100));
  const growth=totalIn-totalOut;
  const moveTotal=totalIn+totalOut||1;
  const inPct=Math.round((totalIn/moveTotal)*100);
  const outPct=100-inPct;
  const netPct=totalIn>0?Math.round((growth/totalIn)*100):0;
  const perProd=DB.products.map(p=>{
    const inQ=DB.tx.filter(t=>t.pid===p.id&&t.type==='in').reduce((s,t)=>s+t.qty,0);
    const outQ=DB.tx.filter(t=>t.pid===p.id&&t.type==='out').reduce((s,t)=>s+t.qty,0);
    const pct=p.initial>0?Math.round((outQ/p.initial)*100):0;
    return {p,inQ,outQ,net:inQ-outQ,pct};
  });
  const metricCfg={
    in:{title:'สินค้าที่รับเข้ามากที่สุด',sub:'อ้างอิงจากยอดรับเข้าสะสมในระบบ',col:'รับเข้าสะสม',sort:(a,b)=>b.inQ-a.inQ,val:x=>`${fmt(x.inQ)} ${x.p.unit}`},
    out:{title:'สินค้าที่เบิกใช้มากที่สุด',sub:'อ้างอิงจากยอดเบิกจ่ายสะสมในระบบ',col:'เบิกจ่ายสะสม',sort:(a,b)=>b.outQ-a.outQ,val:x=>`${fmt(x.outQ)} ${x.p.unit}`},
    pct:{title:'สินค้าที่เบิกใช้เป็น % สูงสุด',sub:'เทียบกับยอดตั้งต้นของสินค้าแต่ละตัว',col:'% เบิกใช้',sort:(a,b)=>b.pct-a.pct,val:x=>`${x.pct}%`},
    net:{title:'สินค้าที่ยอดสุทธิเปลี่ยนแปลงมากที่สุด',sub:'รับเข้า − เบิกจ่าย ของสินค้าแต่ละตัว',col:'ยอดสุทธิ',sort:(a,b)=>Math.abs(b.net)-Math.abs(a.net),val:x=>`${x.net>=0?'+':''}${fmt(x.net)}`},
  };
  const mc=metricCfg[dashFilter];
  body.innerHTML=`
    <div class="kpi-row">
      <div class="stat ${dashFilter==='in'?'on':''}" onclick="setDashFilter('in')"><div class="lbl">รายการรับเข้า</div><div class="num">${fmt(totalIn)} <span style="font-size:14px;color:var(--green)">(${inPct}%)</span></div><div class="sub">หน่วยสะสมทั้งหมด · ${inPct}% ของยอดเคลื่อนไหวรวม</div></div>
      <div class="stat ${dashFilter==='out'?'on':''}" onclick="setDashFilter('out')"><div class="lbl">รายการเบิกจ่าย</div><div class="num">${fmt(totalOut)} <span style="font-size:14px;color:var(--red)">(${outPct}%)</span></div><div class="sub">หน่วยสะสมทั้งหมด · ${outPct}% ของยอดเคลื่อนไหวรวม</div></div>
      <div class="stat ${dashFilter==='pct'?'on':''}" onclick="setDashFilter('pct')"><div class="lbl">สินค้าเบิกใช้ %</div><div class="num">${fmt(totalOut)} <span style="font-size:14px;color:var(--green-dk)">(${soldPct}%)</span></div><div class="sub">เทียบกับยอดตั้งต้นรวม ${fmt(totalInit)} หน่วย</div></div>
      <div class="stat ${dashFilter==='net'?'on':''}" onclick="setDashFilter('net')"><div class="lbl">ยอดสุทธิเปลี่ยนแปลง</div><div class="num" style="color:${growth>=0?'var(--green)':'var(--red)'}">${growth>=0?'+':''}${fmt(growth)} <span style="font-size:14px">(${netPct>=0?'+':''}${netPct}%)</span></div><div class="sub">รับเข้า−เบิกจ่าย · เทียบกับยอดรับเข้า</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="section-title">สัดส่วนสินค้าคงเหลือ</div>
      <div class="section-sub">จำนวนสินค้าทั้งหมดในคลัง แยกย่อยเป็นสัดส่วนของแต่ละรายการ</div>
      ${pieChartSVG()}
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="section-title">จำนวนทั้งหมด vs จำนวนที่ขายออก (รายสินค้า)</div>
      <div class="section-sub">เปรียบเทียบยอดตั้งต้นกับยอดที่เบิกจ่ายออกไปแล้วของสินค้าแต่ละตัว</div>
      ${barCompareSVG()}
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="section-title">สินค้าใกล้หมดอายุ</div>
      <div class="section-sub">เรียงลำดับจากวันหมดอายุใกล้ที่สุดไปไกลที่สุด</div>
      <table><thead><tr><th>ชื่อสินค้า</th><th>คงเหลือ</th><th>วันหมดอายุ</th><th>สถานะ</th></tr></thead><tbody>
      ${DB.products.filter(p=>p.expiry).sort((a,b)=>new Date(a.expiry)-new Date(b.expiry)).map(p=>{const m=monthsUntil(p.expiry);const warn=m<=3;return `<tr><td>${p.name}</td><td>${fmt(p.current)} ${p.unit}</td><td>${p.expiry}</td><td>${warn?`<span class="pill ${m<0?'out':'low'}">${m<0?`หมดอายุแล้ว ${Math.abs(m)} ด.`:`เหลือ ${m} เดือน`}</span>`:`<span class="pill ok">ยังไม่ใกล้หมดอายุ</span>`}</td></tr>`}).join('')||`<tr><td colspan=4 class="empty">ไม่มีข้อมูลวันหมดอายุ</td></tr>`}
      </tbody></table>
    </div>
    <div class="card">
      <div class="section-title">${mc.title}</div>
      <div class="section-sub">${mc.sub} · <a href="#" onclick="setDashFilter('out');return false;" style="color:var(--green-dk);font-weight:700">${dashFilter!=='out'?'กลับเป็นค่าเริ่มต้น':''}</a></div>
      <table><thead><tr><th>ชื่อสินค้า</th><th>${mc.col}</th><th>คงเหลือ</th></tr></thead><tbody>
      ${[...perProd].sort(mc.sort).slice(0,6).map(x=>`<tr><td>${x.p.name}</td><td>${mc.val(x)}</td><td>${fmt(x.p.current)}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
}

render();
</script>
</body>
</html>
